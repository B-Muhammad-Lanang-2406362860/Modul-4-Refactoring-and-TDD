<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Find Payment Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">Payment Detail</h1>
                    <form id="paymentDetailForm">
                        <div class="mb-3">
                            <label for="paymentIdInput" class="form-label">Payment ID</label>
                            <input id="paymentIdInput" name="paymentId" type="text" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary">View Detail</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    const paymentDetailForm = document.getElementById('paymentDetailForm');
    paymentDetailForm.addEventListener('submit', function (event) {
        event.preventDefault();
        const paymentId = document.getElementById('paymentIdInput').value;
        if (paymentId) {
            window.location.href = '/payment/detail/' + encodeURIComponent(paymentId);
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
