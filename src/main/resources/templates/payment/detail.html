<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Payment Detail</h1>
        <a class="btn btn-outline-secondary" th:href="@{/payment/detail}">Search Again</a>
    </div>

    <div class="card shadow-sm" th:if="${payment != null}">
        <div class="card-body">
            <p class="mb-2"><strong>ID:</strong> <span th:text="${payment.id}">payment-1</span></p>
            <p class="mb-2"><strong>Method:</strong> <span th:text="${payment.method}">BANK_TRANSFER</span></p>
            <p class="mb-2"><strong>Status:</strong> <span th:text="${payment.status}">PENDING</span></p>
            <div>
                <strong>Payment Data:</strong>
                <pre class="bg-light p-3 mt-2 rounded" th:text="${payment.paymentData}">{}</pre>
            </div>
        </div>
    </div>

    <div class="alert alert-warning" role="alert" th:if="${payment == null}">
        Payment not found.
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
