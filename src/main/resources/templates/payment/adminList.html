<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Payment List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Admin Payment List</h1>
        <a class="btn btn-outline-secondary" th:href="@{/payment/detail}">Find Payment</a>
    </div>

    <div class="alert alert-info" role="alert" th:if="${payments == null or #lists.isEmpty(payments)}">
        No payments available.
    </div>

    <div class="table-responsive" th:if="${payments != null and !#lists.isEmpty(payments)}">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th scope="col">Payment ID</th>
                <th scope="col">Method</th>
                <th scope="col">Status</th>
                <th scope="col">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="payment : ${payments}">
                <td th:text="${payment.id}">payment-1</td>
                <td th:text="${payment.method}">BANK_TRANSFER</td>
                <td th:text="${payment.status}">PENDING</td>
                <td>
                    <a class="btn btn-sm btn-primary"
                       th:href="@{/payment/admin/detail/{paymentId}(paymentId=${payment.id})}">Review</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
