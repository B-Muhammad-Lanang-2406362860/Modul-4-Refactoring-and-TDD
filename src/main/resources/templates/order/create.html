<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">Create Order</h1>
                    <form th:action="@{/order/create}" method="post" th:object="${order}">
                        <div class="mb-3">
                            <label for="idInput" class="form-label">Order ID</label>
                            <input id="idInput" type="text" class="form-control" th:field="*{id}" required>
                        </div>
                        <div class="mb-3">
                            <label for="authorInput" class="form-label">Author</label>
                            <input id="authorInput" type="text" class="form-control" th:field="*{author}" required>
                        </div>
                        <div class="mb-4">
                            <label for="orderTimeInput" class="form-label">Order Time (Epoch)</label>
                            <input id="orderTimeInput" type="number" class="form-control" th:field="*{orderTime}" min="0" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Create</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
