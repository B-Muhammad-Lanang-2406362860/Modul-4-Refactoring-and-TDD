<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order History List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Order History</h1>
        <a class="btn btn-outline-secondary" th:href="@{/order/history}">Search Again</a>
    </div>

    <div class="alert alert-info" role="alert" th:if="${orders == null or #lists.isEmpty(orders)}">
        No orders found for the selected author.
    </div>

    <div class="table-responsive" th:if="${orders != null and !#lists.isEmpty(orders)}">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th scope="col">Order ID</th>
                <th scope="col">Author</th>
                <th scope="col">Order Time</th>
                <th scope="col">Status</th>
                <th scope="col">Total Products</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}">ORDER-1</td>
                <td th:text="${order.author}">Author Name</td>
                <td th:text="${order.orderTime}">0</td>
                <td>
                    <span class="badge text-bg-secondary" th:text="${order.status}">WAITING_PAYMENT</span>
                </td>
                <td th:text="${order.products != null ? #lists.size(order.products) : 0}">0</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
