<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pay Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-3">Pay Order</h1>
                    <p class="text-muted mb-4">Order ID: <strong th:text="${order != null ? order.id : 'N/A'}">ORDER-1</strong></p>

                    <form th:if="${order != null}" th:action="@{/order/pay/{orderId}(orderId=${order.id})}" method="post">
                        <div class="mb-3">
                            <label for="methodInput" class="form-label">Payment Method</label>
                            <select id="methodInput" name="method" class="form-select" required>
                                <option value="">Select method</option>
                                <option value="BANK_TRANSFER">Bank Transfer</option>
                                <option value="VOUCHER">Voucher</option>
                            </select>
                        </div>

                        <div id="bankTransferGroup" class="d-none">
                            <div class="mb-3">
                                <label for="bankNameInput" class="form-label">Bank Name</label>
                                <input id="bankNameInput" name="bankName" type="text" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="referenceCodeInput" class="form-label">Reference Code</label>
                                <input id="referenceCodeInput" name="referenceCode" type="text" class="form-control">
                            </div>
                        </div>

                        <div id="voucherGroup" class="d-none">
                            <div class="mb-3">
                                <label for="voucherCodeInput" class="form-label">Voucher Code</label>
                                <input id="voucherCodeInput" name="voucherCode" type="text" class="form-control">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">Pay Now</button>
                    </form>

                    <div class="alert alert-warning mb-0" role="alert" th:if="${order == null}">
                        Order was not found.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    const methodInput = document.getElementById('methodInput');
    const bankTransferGroup = document.getElementById('bankTransferGroup');
    const voucherGroup = document.getElementById('voucherGroup');

    if (methodInput) {
        methodInput.addEventListener('change', function () {
            const selectedMethod = methodInput.value;
            bankTransferGroup.classList.toggle('d-none', selectedMethod !== 'BANK_TRANSFER');
            voucherGroup.classList.toggle('d-none', selectedMethod !== 'VOUCHER');
        });
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
